openapi: 3.0.1
info:
  title: Fietsenwinkel
  description: |-
    Dit is een model voor registratie van inventaris en betrokken producenten en klanten van fietsenwinkels.
    Dit model heeft alleen tot doel de aard en toepassing van constructies te illustreren, en is opgezet als een UML realisatie van de in MIM besproken modelelementen.
    Het model staat bekend als IMFW.
    Het model is ontwikkeld onder toezicht van de IFO: Internationale Fietsenwinkels Organisatie.
    Dit model is opgezet conform [MIM 1.2]().
  version: 1.0.0
components:
  schemas:
    Aandrijving:
      type: object
      description: De aandrijving van een fiets.
      anyOf:
      - $ref: ./KettingLijst.yaml#/components/schemas/KettingLijst
      - $ref: ./SnaarLijst.yaml#/components/schemas/SnaarLijst

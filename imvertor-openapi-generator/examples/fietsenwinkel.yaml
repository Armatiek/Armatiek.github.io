components:
  schemas:
    Bankrekening:
      required:
      - rekeningnummer
      type: object
      properties:
        rekeningnummer:
          type: string
          description: Nummer van de rekening.
      description: Rekening bij een bank.
    PaginatedBankrekeningList:
      required:
      - results
      type: object
      allOf:
      - $ref: "#/components/schemas/PaginatedBase"
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: "#/components/schemas/Bankrekening"
    PaginatedBase:
      type: object
      properties:
        next:
          type: string
          format: uri
          nullable: true
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          format: uri
          nullable: true
          example: http://api.example.org/accounts/?page=2
    Creditcard:
      required:
      - kaartnummer
      - verloopdatum
      type: object
      properties:
        kaartnummer:
          type: string
          description: Nummer van de kaart.
        verloopdatum:
          type: string
          description: "Verloopdatum van de kaart (jaar, maand)"
      description: Kaart waarmee op basis van kredieten een betaling wordt gedaan.
    PaginatedCreditcardList:
      required:
      - results
      type: object
      allOf:
      - $ref: "#/components/schemas/PaginatedBase"
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: "#/components/schemas/Creditcard"
    Adres:
      required:
      - huisnummer
      - id
      - postcode
      type: object
      properties:
        id:
          type: integer
          description: Field that is not part of the model but added to define an
            identifying field for this entity
          format: int64
        postcode:
          type: string
          description: Postcode in een adres.
        huisnummer:
          type: string
          description: Huisnummer met eventuele toevoegingen.
        punt:
          $ref: "#/components/schemas/Reference"
        vlak:
          $ref: "#/components/schemas/Reference"
      description: Het adres van een contact.
    Klant:
      required:
      - betalingBankBankrekening
      - betalingCreditCreditcard
      - betreftPersoon
      - naam
      - nieuwsbrief
      - postadres
      type: object
      properties:
        naam:
          type: string
          description: De naam van het contact.
        postadres:
          $ref: "#/components/schemas/Adres"
        betalingBankBankrekening:
          type: array
          description: Een contact doet een betaling met een betaalmiddel.
          items:
            $ref: "#/components/schemas/Bankrekening"
        betalingCreditCreditcard:
          type: array
          description: Een contact doet een betaling met een betaalmiddel.
          items:
            $ref: "#/components/schemas/Creditcard"
        nieuwsbrief:
          type: boolean
          description: Indicatie dat de klant de nieuwsbrief wenst te ontvangen.
        betreftPersoon:
          $ref: "#/components/schemas/Persoon"
      description: Een persoon die een fiets heeft gekocht.
    PaginatedKlantList:
      required:
      - results
      type: object
      allOf:
      - $ref: "#/components/schemas/PaginatedBase"
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: "#/components/schemas/Klant"
    Persoon:
      required:
      - achternaam
      - id
      type: object
      properties:
        id:
          type: integer
          description: Field that is not part of the model but added to define an
            identifying field for this entity
          format: int64
        voornaam:
          type: string
          description: "De roepnaam van een Persoon , vol uitgeschreven."
        achternaam:
          type: string
          description: De achternaam van de Persoon .
      description: Een natuurlijk persoon.
    Reference:
      required:
      - id
      - url
      type: object
      properties:
        id:
          maxLength: 40
          minLength: 1
          type: string
          description: ID van de resource waarnaar verwezen wordt
        url:
          minLength: 1
          type: string
          description: URL-referentie naar de resource waarnaar verwezen wordt
          format: uri
          readOnly: true
      description: Reference to another resource
    Leverancier:
      required:
      - betalingBankBankrekening
      - betalingCreditCreditcard
      - kvkNummer
      - naam
      - postadres
      type: object
      properties:
        naam:
          type: string
          description: De naam van het contact.
        postadres:
          $ref: "#/components/schemas/Adres"
        betalingBankBankrekening:
          type: array
          description: Een contact doet een betaling met een betaalmiddel.
          items:
            $ref: "#/components/schemas/Bankrekening"
        betalingCreditCreditcard:
          type: array
          description: Een contact doet een betaling met een betaalmiddel.
          items:
            $ref: "#/components/schemas/Creditcard"
        kvkNummer:

openapi: 3.0.1
info:
  title: Fietsenwinkel OpenAPI specificatie
  description: Dit is een demo OpenAPI specificatie voor registratie van inventaris
    en betrokken producenten en klanten van fietsenwinkels.
  contact:
    url: https://armatiek.nl
  license:
    name: "European Union Public License, version 1.2 (EUPL-1.2)"
    url: https://eupl.eu/1.2/nl/
  version: 1.2.3
servers: []
tags:
- name: Bankrekening
  description: Rekening bij een bank.
- name: Creditcard
  description: Kaart waarmee op basis van kredieten een betaling wordt gedaan.
- name: Klant
  description: Een persoon die een fiets heeft gekocht.
- name: Leverancier
  description: Een instelling die een fietsen levert.
- name: Batterij
  description: De batterij van de E-Bike.
- name: Sportfiets
  description: Een fiets bedoeld voor gebruik in sportieve toepassingen.
- name: Stadsfiets
  description: Een fiets die is ingericht op gebruik in het stadsverkeer.
- name: Winkel
  description: Een locatie waar fietsen worden verkocht.
- name: Persoon
  description: Een natuurlijk persoon.
